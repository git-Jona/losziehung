<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Losziehung</title>
<link rel="manifest" href="./manifest.json"> <link rel="apple-touch-icon" href="./icon-180.png"> <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-title" content="Losziehung"> <style>
:root{--red:#d6001c;--bg:#f4f5f7;--ink:#1d2330;--mut:#6b7280;--sh:0 8px 24px rgba(20,30,50,.10),0 2px 6px rgba(20,30,50,.06)} *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);border-top:6px solid var(--red);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)} header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;flex-wrap:wrap} header img{max-height:56px;max-width:180px;object-fit:contain}
.tools{display:flex;gap:10px;align-items:center;margin-left:auto}
#cnt{font-size:15px;color:var(--mut);background:#fff;padding:9px 16px;border-radius:14px;box-shadow:var(--sh)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:11px 18px;background:var(--red);color:#fff;box-shadow:var(--sh);cursor:pointer}
button.g{background:#fff;color:var(--ink)}
button:disabled{opacity:.45}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;min-height:0}
.globe{position:relative;width:min(56vh,80vw);aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(255,255,255,.4) 40%,rgba(200,210,225,.3));border:2px solid #fff;box-shadow:inset 0 0 40px rgba(120,140,170,.3),var(--sh)} .globe::after{content:"";position:absolute;left:14%;top:8%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg);filter:blur(4px)}
.b{position:absolute;width:11%;aspect-ratio:1;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.25);animation:fl 2.6s ease-in-out infinite alternate} @keyframes fl{to{transform:translate(var(--dx),var(--dy))}}
.shake{animation:sh .9s}
@keyframes sh{0%,100%{transform:none}15%{transform:translateX(-10px) rotate(-3deg)}35%{transform:translateX(10px) rotate(3deg)}55%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}} #go{font-size:22px;padding:18px 54px;border-radius:18px} #ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(244,245,247,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:5}
#ov.on{display:flex}
.ball{position:relative;width:min(50vh,70vw);aspect-ratio:1;cursor:pointer}
.ball.pop{animation:pop .8s cubic-bezier(.2,1.1,.4,1)} @keyframes pop{from{transform:translateY(45vh) scale(.2)}to{transform:none}} .h{position:absolute;left:0;width:100%;height:50%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);box-shadow:var(--sh)}
.t{top:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(160deg,#ff4d63,var(--red))}
.bt{bottom:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(200deg,#fff,#d5d9e1)}
.open .t{transform:translateY(-42%) rotate(-9deg)} .open .bt{transform:translateY(42%) rotate(6deg)} .slip{position:absolute;left:50%;top:50%;width:78%;min-height:34%;padding:4% 5%;border-radius:18px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;transform:translate(-50%,-50%) scale(0);transition:transform .45s .15s} .open .slip{transform:translate(-50%,-50%) scale(1)} .slip small{color:var(--mut);font-size:clamp(12px,2vh,16px);text-transform:uppercase;letter-spacing:.1em}
.slip b{font-size:clamp(22px,5vh,44px);line-height:1.15;margin-top:6px}
.slip.win b,.slip.win small{color:var(--red)} .hint{margin:0;color:var(--mut);opacity:0;transition:opacity .4s .6s} .ball.open+.hint{opacity:1} #dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(29,35,48,.35);z-index:9;padding:16px}
#dlg.on{display:flex}
#box{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:24px;width:min(560px,100%);max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text}
h3{margin:0 0 12px}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
input,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid #d5d9e1;border-radius:12px;font:inherit;font-size:16px;color:var(--ink)}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;margin:0} .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.er{color:var(--red);min-height:1em;margin:6px 0 0}.mut{color:var(--mut);margin:0 0 10px} .tb{max-height:50vh;overflow:auto;border-radius:12px;border:1px solid #eceef2} table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #eceef2} tr.w td{color:var(--red);font-weight:600}

css .opt{display:flex;gap:8px;align-items:flex-start;max-width:min(620px,88vw);font-size:12px;line-height:1.4;color:var(--mut);text-align:left;cursor:pointer}
.opt input{width:20px;height:20px;margin:0;padding:0;flex:none;accent-color:var(--red)}
.opt a{color:var(--red);text-decoration:underline}
pre.doc{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.5;margin:0;max-height:55vh;overflow:auto}
  
</style></head>
<body>
<header>
  <img src="logo.png" alt="" onerror="this.remove()">
  <div class="tools"><span id="cnt"></span><button class="g" id="bh">Historie</button><button class="g" id="bs">Neu füllen</button></div> </header> <main>
  <div class="globe" id="g"></div>
  <button id="go">Los ziehen</button>
    
  <label class="opt"><input type="checkbox" id="chk" autocomplete="off"><span>Ja, ich möchte am Gewinnspiel teilnehmen. Ich akzeptiere die <a href="teilnahmebedingungen.txt" data-doc="teilnahmebedingungen.txt">Teilnahmebedingungen</a> und habe die <a href="datenschutz.txt" data-doc="datenschutz.txt">Datenschutzhinweise</a> zur Kenntnis genommen. Der Rechtsweg ist ausgeschlossen.</span></label>   
    
</main>
<div id="ov"><div class="ball" id="ball"><div class="h t"></div><div class="h bt"></div><div class="slip" id="sl"></div></div><p class="hint">Zum Schließen die Kugel antippen</p></div> <div id="dlg"><div id="box"></div></div> <script> const $=id=>document.getElementById(id),K="losziehung_stand_v1",PW="Payment";
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n; const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEF={total:100,prizes:"5 x 40 € Gewinn\n10 x 20 € Gewinn",nit:"Leider kein Gewinn"}; function build(c){const p=[];let s=0;for(const ln of c.prizes.split("\n")){if(!ln.trim())continue;const m=ln.trim().match(/^(\d+)\s*[x×]\s*(.+)$/i);if(!m)return"Zeile ungültig: "+ln;for(let i=0;i<+m[1];i++)p.push({t:m[2].trim(),w:1});s+=+m[1]}
if(s>c.total)return"Es gibt mehr Gewinne als Lose insgesamt.";for(let i=s;i<c.total;i++)p.push({t:c.nit,w:0});return p} function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.pool)return s}catch(e){}return{cfg:DEF,pool:build(DEF),hist:[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),busy=0,st=0;
const ov=$("ov"),ball=$("ball"),dlg=$("dlg"),box=$("box");
function fillGlobe(){const g=$("g");g.innerHTML="";const n=Math.min(28,Math.max(S.pool.length?6:0,S.pool.length)),c=["#d6001c","#fff","#c9ced8","#1d2330","#ff6b7d"];
for(let i=0;i<n;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*38,b=document.createElement("i");b.className="b";
b.style.cssText=`left:${50+r*Math.cos(a)-5.5}%;top:${50+r*Math.sin(a)-5.5}%;background:${c[i%5]};--dx:${rnd(9)-4}%;--dy:${rnd(9)-4}%;animation-delay:-${Math.random()*3}s`;g.appendChild(b)}}
function ui(){$("cnt").textContent=`Lose: ${S.pool.length} / ${S.cfg.total}`;$("go").disabled=busy||!S.pool.length||!$("chk").checked;$("go").textContent=S.pool.length?"Los ziehen":"Alle Lose gezogen"} $("go").onclick=()=>{if(busy||!S.pool.length||!$("chk").checked)return;busy=1;ui();
const[l]=S.pool.splice(rnd(S.pool.length),1);S.hist.push({n:(S.hist.length?S.hist[S.hist.length-1].n:0)+1,z:Date.now(),t:l.t,w:l.w});save();
$("g").classList.add("shake");
setTimeout(()=>{$("g").classList.remove("shake");$("sl").className="slip"+(l.w?" win":"");$("sl").innerHTML=`<small>${l.w?"Gewinn!":"Dein Los"}</small><b>${esc(l.t)}</b>`; ov.classList.add("on");ball.className="ball pop";setTimeout(()=>{ball.classList.add("open");st=1},850)},900)};
ball.onclick=()=>{if(st!==1)return;st=2;ball.classList.remove("open");
setTimeout(()=>{ov.classList.remove("on");ball.className="ball";st=0;busy=0;$("chk").checked=false;fillGlobe();ui()},750)};
function show(h){box.innerHTML=h+'<div class="row"><button class="g" onclick="dlg.classList.remove(\'on\')">Schließen</button></div>';dlg.classList.add("on")}
function gate(fn){show('<h3>Passwort</h3><input id="pw" type="password" autocomplete="off"><p id="er" class="er"></p><div class="row"><button id="ok">OK</button></div>'); const p=$("pw"),go=()=>{if(p.value===PW)fn();else{$("er").textContent="Falsches Passwort";p.value=""}};$("ok").onclick=go;p.onkeydown=e=>{if(e.key==="Enter")go()};p.focus()}
function hist(){const h=S.hist.slice().reverse(),w=S.hist.filter(x=>x.w).length,rw=S.pool.filter(x=>x.w).length;
show(`<h3>Historie</h3><p class="mut">${S.hist.length} gezogen · ${w} Gewinne · noch ${rw} Gewinne im Topf</p><div class="tb"><table><tr><th>Nr.</th><th>Zeit</th><th>Los</th></tr>${h.map(x=>`<tr class="${x.w?"w":""}"><td>${x.n}</td><td>${new Date(x.z).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"medium"})}</td><td>${esc(x.t)}</td></tr>`).join("")}</table></div><div class="row"><button id="ex">Exportieren (CSV)</button></div>`); $("ex").onclick=exp} async function exp(){const csv="Nr;Zeit;Los;Gewinn\n"+S.hist.map(x=>[x.n,new Date(x.z).toLocaleString("de-DE"),'"'+x.t.replace(/"/g,'""')+'"',x.w?"ja":"nein"].join(";")).join("\n");
try{const f=new File(["\ufeff"+csv],"losziehung.csv",{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f]});await navigator.clipboard.writeText(csv);alert("In die Zwischenablage kopiert")}catch(e){}} function cfg(){const c=S.cfg; show(`<h3>Neu füllen / Zurücksetzen</h3><label>Lose insgesamt<input id="c1" type="number" min="1" value="${c.total}"></label><label>Gewinne (je Zeile: Anzahl x Text, z. B. 5 x 40 € Gutschein)<textarea id="c2" rows="4">${esc(c.prizes)}</textarea></label><label>Text auf den Nieten<input id="c3" value="${esc(c.nit)}"></label><label class="ck"><input id="c4" type="checkbox"> Historie ebenfalls löschen</label><p id="er" class="er"></p><div class="row"><button id="ok">Neu füllen</button></div>`); $("ok").onclick=()=>{const n={total:Math.max(1,+$("c1").value|0),prizes:$("c2").value,nit:$("c3").value||"Leider kein Gewinn"},p=build(n); if(typeof p==="string"){$("er").textContent=p;return}if(!confirm("Kugel wirklich neu füllen?"))return; S.cfg=n;S.pool=p;if($("c4").checked)S.hist=[];save();fillGlobe();ui();dlg.classList.remove("on")}}
$("bh").onclick=()=>gate(hist);$("bs").onclick=()=>gate(cfg);
async function doc(f,t){let x;try{const r=await fetch(f);if(!r.ok)throw 0;x=await r.text()}catch(e){x="Dokument konnte nicht geladen werden."}show(`<h3>${esc(t)}</h3><pre class="doc">${esc(x)}</pre>`)} document.querySelectorAll("[data-doc]").forEach(a=>a.onclick=e=>{e.preventDefault();doc(a.dataset.doc,a.textContent)});  
$("chk").checked=false;
["change","input","click"].forEach(ev=>$("chk").addEventListener(ev,ui));$("chk").onchange=ui;
fillGlobe();ui();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
